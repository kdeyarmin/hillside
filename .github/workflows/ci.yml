name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # The build prerenders the statically generated routes, and Prisma is
    # generated from the schema, so a real database is cheaper than discovering
    # in production that the build only ever compiled.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hillside
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hillside
      NEXT_PUBLIC_SITE_URL: https://thehillsidegardens.com
      ADMIN_PASSWORD: test-admin-password
      ADMIN_SESSION_SECRET: test-session-secret
      CLASS_ACCESS_SECRET: test-class-access-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

      # Each of these guards a class of defect that reached this codebase and was
      # only found by reading it: type errors the build did not surface, unused
      # and dead code, accessibility regressions, and the money and token logic
      # in lib/, which had no tests at all.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

      # The same command the deploy runs, against an empty database, so a broken
      # or missing migration fails here rather than on Railway. `db push` stood
      # here before and would happily build a schema no migration describes,
      # which is precisely the drift that makes a deploy fail on its own.
      #
      # It runs *before* the tests on purpose. Some of them need the schema —
      # the durable rate limiter can only be exercised against a real database —
      # and they are written to skip rather than fail when there is nothing to
      # talk to. With the tests first they found an empty database and skipped
      # every one of those, which is worse than not having them: a silent pass
      # that reads like coverage.
      - name: Apply migrations
        run: npm run db:migrate

      # Migrations are the only thing allowed to change the schema, so they have
      # to add up to it exactly. This prints nothing and succeeds when the
      # database they just built already matches schema.prisma.
      - name: Check for schema drift
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "No drift: the migrations describe the schema exactly."

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
