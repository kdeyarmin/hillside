<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Potting bench</title>
  <desc id="d">A potting bench with a plant mid-repot, terracotta pots, a bag of soil, a trowel and garden tools hung on the wall behind.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#faf6ea"/>
      <stop offset="0.5" stop-color="#e6e4d1"/>
      <stop offset="1" stop-color="#adb997"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2c8ab"/>
      <stop offset="1" stop-color="#828f6a"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c9ad82"/>
      <stop offset="0.55" stop-color="#a2875e"/>
      <stop offset="1" stop-color="#6b5738"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#c87f52"/>
      <stop offset="1" stop-color="#8d4b2b"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ded0b0"/>
      <stop offset="0.6" stop-color="#bda986"/>
      <stop offset="1" stop-color="#8b7853"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#2c5336"/>
      <stop offset="1" stop-color="#5e8d57"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="660" y="-140" width="400" height="640" rx="200" fill="#ffffff" opacity="0.36" filter="url(#soft)"/>
  <circle cx="210" cy="760" r="250" fill="#1d3a26" opacity="0.11" filter="url(#soft)"/>

  <!-- board wall -->
  <g stroke="#c6c8ae" stroke-width="4" opacity="0.7">
    <path d="M0 150 H1200"/><path d="M0 296 H1200"/><path d="M0 442 H1200"/>
  </g>

  <!-- tool rail -->
  <rect x="292" y="196" width="620" height="16" rx="8" fill="#a2875e"/>
  <g fill="#8a7a5c">
    <circle cx="392" cy="220" r="9"/><circle cx="556" cy="220" r="9"/><circle cx="720" cy="220" r="9"/><circle cx="856" cy="220" r="9"/>
  </g>

  <!-- hanging trowel -->
  <g transform="translate(392 226)">
    <path d="M0 0 V 96" stroke="#8c7a5a" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M-30 96 C -30 148 -14 190 0 210 C 14 190 30 148 30 96Z" fill="#9aa68c" stroke="#75816a" stroke-width="3.5"/>
    <path d="M-30 96 C -30 146 -16 186 -2 208 C -8 168 -12 130 -12 96Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- hanging fork -->
  <g transform="translate(556 226)">
    <path d="M0 0 V 104" stroke="#8c7a5a" stroke-width="13" stroke-linecap="round" fill="none"/>
    <g stroke="#9aa68c" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M-22 108 V 194"/><path d="M0 108 V 202"/><path d="M22 108 V 194"/>
    </g>
    <rect x="-30" y="98" width="60" height="18" rx="8" fill="#75816a"/>
  </g>

  <!-- hanging twine spool -->
  <g transform="translate(720 226)">
    <path d="M0 0 V 60" stroke="#8c7a5a" stroke-width="8" fill="none"/>
    <ellipse cx="0" cy="106" rx="48" ry="46" fill="#d8c39a" stroke="#b09a6f" stroke-width="3.5"/>
    <g stroke="#b09a6f" stroke-width="3" fill="none" opacity="0.8">
      <path d="M-34 88 C -8 76 22 80 40 96"/>
      <path d="M-40 108 C -12 96 20 100 42 116"/>
      <path d="M-34 128 C -8 118 20 122 38 134"/>
    </g>
    <path d="M40 118 C 62 138 66 166 58 190" fill="none" stroke="#b09a6f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- hanging snips -->
  <g transform="translate(856 226)">
    <path d="M0 0 V 52" stroke="#8c7a5a" stroke-width="8" fill="none"/>
    <g stroke="#75816a" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M-16 60 L-30 148"/><path d="M16 60 L30 148"/>
    </g>
    <g stroke="#9aa68c" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-14 56 L14 12"/><path d="M14 56 L-14 12"/>
    </g>
    <circle cx="0" cy="58" r="9" fill="#5f6a55"/>
  </g>

  <rect x="0" y="770" width="1200" height="130" fill="url(#floor)"/>
  <rect x="0" y="766" width="1200" height="8" fill="#75825e" opacity="0.5"/>

  <!-- bench legs -->
  <rect x="252" y="612" width="28" height="176" rx="6" fill="#6b5738"/>
  <rect x="920" y="612" width="28" height="176" rx="6" fill="#6b5738"/>
  <rect x="266" y="722" width="668" height="16" rx="6" fill="#7d6743"/>

  <!-- things on the bench -->
  <g transform="translate(430 612)">
    <ellipse cx="0" cy="4" rx="118" ry="14" fill="#1d3a26" opacity="0.24" filter="url(#cast)"/>
    <g fill="none" stroke="#3d6b43" stroke-width="8" stroke-linecap="round">
      <path d="M-4 -128 C -28 -206 -44 -262 -54 -304"/>
      <path d="M-4 -128 C 22 -202 44 -252 62 -290"/>
      <path d="M-4 -128 C -8 -190 -8 -236 -2 -276"/>
    </g>
    <g fill="url(#leafA)" stroke="#2b5334" stroke-width="3" stroke-linejoin="round">
      <path d="M-54 -304 c -40 -18 -54 -60 -32 -94 c 40 20 56 60 32 94Z"/>
      <path d="M-54 -304 c 20 -38 66 -48 96 -22 c -24 34 -70 40 -96 22Z"/>
      <path d="M62 -290 c -26 -32 -20 -76 14 -100 c 26 32 20 76 -14 100Z"/>
      <path d="M-2 -276 c -32 -16 -42 -52 -22 -80 c 32 18 44 52 22 80Z"/>
      <path d="M-2 -276 c 18 -32 56 -40 80 -18 c -20 28 -58 34 -80 18Z"/>
    </g>
    <path d="M-84 -130 C -80 -84 -70 -38 -56 0 H56 C 70 -38 80 -84 84 -130Z" fill="url(#terracotta)"/>
    <path d="M-84 -130 C -80 -84 -70 -38 -56 0 H-22 C -34 -40 -44 -86 -48 -130Z" fill="#ffffff" opacity="0.14"/>
    <rect x="-96" y="-158" width="192" height="32" rx="8" fill="#b06a41"/>
    <path d="M-80 -130 C -44 -142 -12 -140 16 -132 C 48 -142 66 -138 80 -130Z" fill="#4a3a2b"/>
  </g>

  <!-- soil sack -->
  <g transform="translate(792 612)">
    <ellipse cx="0" cy="4" rx="104" ry="14" fill="#1d3a26" opacity="0.24" filter="url(#cast)"/>
    <path d="M-82 0 C -92 -58 -80 -114 -50 -152 C -30 -178 30 -178 50 -152 C 80 -114 92 -58 82 0Z" fill="url(#sack)" stroke="#95835d" stroke-width="3.5"/>
    <path d="M-82 0 C -91 -56 -80 -112 -50 -150 C -40 -100 -44 -48 -36 0Z" fill="#ffffff" opacity="0.3"/>
    <path d="M-50 -152 C -30 -166 30 -166 50 -152 C 36 -186 -36 -186 -50 -152Z" fill="#b6a074" stroke="#95835d" stroke-width="3"/>
    <path d="M-42 -160 C -16 -172 16 -172 42 -160" fill="none" stroke="#8a7551" stroke-width="6" stroke-linecap="round"/>
    <g fill="#4a3a2b">
      <circle cx="-18" cy="-176" r="11"/><circle cx="8" cy="-182" r="12"/><circle cx="32" cy="-172" r="10"/>
    </g>
    <g fill="#3d6b43">
      <path d="M-30 -96 c 18 -16 42 -13 56 8 c -20 15 -44 12 -56 -8Z"/>
    </g>
    <g fill="#b9892e" opacity="0.85">
      <rect x="-38" y="-70" width="76" height="6" rx="3"/>
      <rect x="-26" y="-50" width="52" height="6" rx="3"/>
    </g>
  </g>

  <!-- small pots and trowel on the bench -->
  <g transform="translate(600 612)">
    <ellipse cx="0" cy="4" rx="58" ry="10" fill="#1d3a26" opacity="0.22" filter="url(#cast)"/>
    <path d="M-42 -52 C -39 -32 -34 -14 -28 0 H28 C 34 -14 39 -32 42 -52Z" fill="url(#terracotta)"/>
    <rect x="-50" y="-68" width="100" height="18" rx="6" fill="#b06a41"/>
    <path d="M-36 -100 C -33 -82 -29 -68 -24 -56 H24 C 29 -68 33 -82 36 -100Z" fill="#cd8a5c"/>
    <rect x="-44" y="-116" width="88" height="18" rx="6" fill="#bb7549"/>
  </g>

  <g transform="translate(300 604)">
    <rect x="-6" y="-16" width="128" height="15" rx="7" fill="#8c7a5a" transform="rotate(-7 -6 -16)"/>
    <path d="M-8 -22 C -46 -26 -74 -16 -84 2 C -70 18 -34 20 -6 6Z" fill="#9aa68c" stroke="#75816a" stroke-width="3.5"/>
  </g>

  <!-- bench top -->
  <rect x="240" y="608" width="720" height="26" rx="7" fill="url(#bench)"/>
  <rect x="240" y="608" width="720" height="9" rx="4" fill="#d9c096" opacity="0.75"/>

  <!-- spilled soil -->
  <g fill="#4a3a2b" opacity="0.85">
    <ellipse cx="336" cy="640" rx="34" ry="8"/>
    <ellipse cx="704" cy="644" rx="26" ry="7"/>
  </g>
  <g fill="#5d4a36">
    <circle cx="318" cy="638" r="6"/><circle cx="348" cy="642" r="5"/><circle cx="698" cy="642" r="5"/><circle cx="716" cy="645" r="4"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
