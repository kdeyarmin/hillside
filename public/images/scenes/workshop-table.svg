    <path d="M-74 -174 C -86 -136 -88 -56 -72 -24" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-184" rx="92" ry="19" fill="#eef3ea" opacity="0.8" stroke="#dbe3d5" stroke-width="3"/>
