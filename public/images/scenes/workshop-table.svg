  <g transform="translate(324 640)">
    <ellipse cx="0" cy="6" rx="70" ry="11" fill="#1d3a26" opacity="0.22" filter="url(#cast)"/>
    <path d="M-52 -44 C -49 -27 -44 -12 -38 0 H38 C 44 -12 49 -27 52 -44Z" fill="url(#terracotta)"/>
    <rect x="-60" y="-58" width="120" height="17" rx="6" fill="#b06a41"/>
