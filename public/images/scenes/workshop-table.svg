<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Workshop table</title>
  <desc id="d">A class workshop table set with two terrariums in progress, a tray of moss and gravel, planting tools and seedlings.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fbf8ed"/>
      <stop offset="0.5" stop-color="#e3e6d3"/>
      <stop offset="1" stop-color="#a7b795"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfc7a8"/>
      <stop offset="1" stop-color="#7d8a66"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#cdb287"/>
      <stop offset="0.55" stop-color="#a58a60"/>
      <stop offset="1" stop-color="#6d5939"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#e9f0e6" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#8ea08a" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#c87f52"/>
      <stop offset="1" stop-color="#8d4b2b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="jarA"><path d="M-92 -184 C -102 -140 -104 -50 -88 -18 C -74 12 74 12 88 -18 C 104 -50 102 -140 92 -184Z"/></clipPath>
    <clipPath id="jarB"><path d="M-70 -136 C -80 -100 -80 -40 -66 -14 C -54 10 54 10 66 -14 C 80 -40 80 -100 70 -136Z"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="640" y="-140" width="400" height="620" rx="200" fill="#ffffff" opacity="0.36" filter="url(#soft)"/>
  <circle cx="210" cy="760" r="250" fill="#1d3a26" opacity="0.11" filter="url(#soft)"/>

