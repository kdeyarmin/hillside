    </g>
    <path d="M-70 -136 C -80 -100 -80 -40 -66 -14 C -54 10 54 10 66 -14 C 80 -40 80 -100 70 -136Z" fill="url(#glassBody)" stroke="#f2f6ee" stroke-width="4.5" stroke-opacity="0.85"/>
    <path d="M-54 -128 C -64 -98 -64 -46 -52 -20" fill="none" stroke="#ffffff" stroke-width="9" stroke-opacity="0.5" stroke-linecap="round"/>
