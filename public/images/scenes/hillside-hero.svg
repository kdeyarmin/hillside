<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">The Hillside Gardens greenhouse shelf</title>
  <desc id="d">A sunlit greenhouse shelf of potted plants, a hanging trailing plant and a watering can beside a large floor planter.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fcf9ef"/>
      <stop offset="0.5" stop-color="#e5e8d5"/>
      <stop offset="1" stop-color="#a9ba9c"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#dfe9dc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c5ccae"/>
      <stop offset="1" stop-color="#828f6a"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c9ad82"/>
      <stop offset="0.6" stop-color="#a2875e"/>
      <stop offset="1" stop-color="#6f5b3c"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#c87f52"/>
      <stop offset="1" stop-color="#8d4b2b"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f6f1e5"/>
      <stop offset="1" stop-color="#cfc6b0"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#2c5336"/>
      <stop offset="1" stop-color="#5e8d57"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#23452c"/>
      <stop offset="1" stop-color="#4b7648"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <g id="spray2">
      <path d="M0 0 C -5 -44 -5 -84 0 -120" fill="none" stroke="#3f6b43" stroke-width="5" stroke-linecap="round"/>
      <path d="M-2 -22 c -23 -6 -37 -23 -35 -44 c 23 4 37 21 35 44Z"/>
      <path d="M2 -22 c 23 -6 37 -23 35 -44 c -23 4 -37 21 -35 44Z"/>
      <path d="M-2 -58 c -21 -6 -33 -23 -31 -42 c 21 5 33 22 31 42Z"/>
      <path d="M2 -58 c 21 -6 33 -23 31 -42 c -21 5 -33 22 -31 42Z"/>
      <path d="M0 -92 c -16 -6 -25 -21 -23 -37 c 17 6 26 21 23 37Z"/>
      <path d="M0 -92 c 16 -6 25 -21 23 -37 c -17 6 -26 21 -23 37Z"/>
      <path d="M0 -112 c -10 -9 -12 -25 -5 -37 c 11 9 14 25 5 37Z"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>

  <!-- greenhouse window -->
  <g>
    <path d="M232 720 V320 C 232 176 358 84 600 84 C 842 84 968 176 968 320 V720Z" fill="url(#pane)"/>
    <path d="M232 720 V320 C 232 176 358 84 600 84 C 842 84 968 176 968 320 V720Z" fill="none" stroke="#c3cdb8" stroke-width="7"/>
    <g stroke="#c3cdb8" stroke-width="6" opacity="0.85">
      <path d="M600 84 V720"/>
      <path d="M232 320 H968"/>
      <path d="M232 520 H968"/>
      <path d="M416 100 V720"/>
      <path d="M784 100 V720"/>
    </g>
  </g>
  <rect x="700" y="-100" width="360" height="700" rx="180" fill="#ffffff" opacity="0.4" filter="url(#soft)"/>
  <circle cx="200" cy="760" r="250" fill="#1d3a26" opacity="0.1" filter="url(#soft)"/>

  <rect x="0" y="720" width="1200" height="180" fill="url(#floor)"/>
  <rect x="0" y="716" width="1200" height="8" fill="#75825e" opacity="0.5"/>

  <!-- hanging trailing plant -->
  <g transform="translate(268 214)">
    <path d="M0 -214 V -34" fill="none" stroke="#8b7f66" stroke-width="4"/>
    <g stroke="#8b7f66" stroke-width="4" fill="none">
      <path d="M0 -34 L-56 6"/><path d="M0 -34 L56 6"/>
    </g>
    <path d="M-58 4 C -54 44 -44 74 -32 96 H32 C 44 74 54 44 58 4Z" fill="url(#terracotta)"/>
    <path d="M-58 4 C -54 44 -44 74 -32 96 H-4 C -14 62 -22 34 -26 4Z" fill="#ffffff" opacity="0.14"/>
    <rect x="-68" y="-18" width="136" height="26" rx="7" fill="#b06a41"/>
    <g fill="none" stroke="#406d42" stroke-width="5" stroke-linecap="round">
      <path d="M-34 2 C -66 44 -84 96 -92 156"/>
      <path d="M28 2 C 54 48 68 100 72 148"/>
      <path d="M-4 2 C -10 56 -6 108 6 152"/>
    </g>
    <g fill="url(#leafB)">
      <path d="M-52 34 c -23 -8 -30 -30 -18 -48 c 21 4 34 22 30 41 c -2 7 -7 10 -12 7Z"/>
      <path d="M-72 82 c -23 -6 -32 -27 -22 -46 c 21 5 34 24 30 42 c -2 6 -5 8 -8 4Z"/>
      <path d="M-88 134 c -22 -2 -34 -22 -26 -41 c 21 3 33 21 32 39 c 0 6 -3 7 -6 2Z"/>
      <path d="M40 44 c 23 -8 30 -30 18 -48 c -21 4 -34 22 -30 41 c 2 7 7 10 12 7Z"/>
      <path d="M60 96 c 22 -6 31 -26 22 -44 c -21 5 -33 23 -29 40 c 1 6 4 7 7 4Z"/>
      <path d="M-2 54 c -22 -9 -28 -31 -14 -48 c 20 6 31 25 26 43 c -2 6 -7 8 -12 5Z"/>
      <path d="M8 108 c 22 -8 30 -28 20 -46 c -21 6 -32 24 -28 42 c 2 6 5 7 8 4Z"/>
    </g>
  </g>

  <!-- shelving unit -->
  <g>
    <rect x="336" y="392" width="26" height="330" rx="6" fill="url(#shelf)"/>
    <rect x="842" y="392" width="26" height="330" rx="6" fill="url(#shelf)"/>

    <!-- upper shelf plants -->
    <g transform="translate(444 560)">
      <ellipse cx="0" cy="4" rx="66" ry="11" fill="#1d3a26" opacity="0.26" filter="url(#cast)"/>
      <g fill="url(#leafA)" stroke="#2b5334" stroke-width="2.6" stroke-linejoin="round">
        <use href="#spray2" transform="translate(-16 -60) rotate(-16) scale(0.72)"/>
        <use href="#spray2" transform="translate(16 -62) rotate(15) scale(0.66)"/>
        <use href="#spray2" transform="translate(0 -64) scale(0.86)"/>
      </g>
      <path d="M-44 -62 C -41 -38 -35 -16 -28 0 H28 C 35 -16 41 -38 44 -62Z" fill="url(#stone)"/>
      <rect x="-52" y="-78" width="104" height="20" rx="6" fill="#efe9dc"/>
    </g>

    <g transform="translate(604 560)">
      <ellipse cx="0" cy="4" rx="74" ry="12" fill="#1d3a26" opacity="0.26" filter="url(#cast)"/>
      <g stroke="#1e3d29" stroke-width="2.6">
        <path d="M0 -70 c -16 -60 -13 -140 3 -200 c 15 60 15 138 4 200Z" fill="#2f5c3a" transform="rotate(-14)"/>
        <path d="M0 -70 c -15 -66 -11 -148 4 -216 c 16 68 15 150 3 216Z" fill="#3d7146" transform="rotate(-2)"/>
        <path d="M0 -70 c -14 -58 -10 -132 4 -190 c 16 60 14 132 3 190Z" fill="#2f5c3a" transform="rotate(12)"/>
      </g>
      <path d="M-48 -72 C -45 -44 -38 -18 -31 0 H31 C 38 -18 45 -44 48 -72Z" fill="#2c4a33"/>
      <rect x="-56" y="-90" width="112" height="22" rx="6" fill="#234029"/>
    </g>

    <g transform="translate(768 560)">
      <ellipse cx="0" cy="4" rx="60" ry="10" fill="#1d3a26" opacity="0.24" filter="url(#cast)"/>
      <g fill="none" stroke="#406d42" stroke-width="5" stroke-linecap="round">
        <path d="M-14 -54 C -44 -30 -62 -6 -74 20"/>
        <path d="M12 -56 C 36 -34 52 -14 62 10"/>
      </g>
      <g fill="url(#leafB)">
        <path d="M-34 -40 c -20 -8 -26 -28 -15 -44 c 18 5 28 23 24 39 c -1 6 -5 8 -9 5Z"/>
        <path d="M-58 -12 c -20 -5 -28 -24 -19 -40 c 19 4 29 21 26 37 c -1 5 -4 6 -7 3Z"/>
        <path d="M28 -42 c 20 -10 40 -2 47 16 c -17 12 -38 6 -47 -16Z"/>
        <path d="M52 -14 c 21 -7 40 4 44 22 c -19 10 -39 2 -44 -22Z"/>
      </g>
      <path d="M-40 -56 C -37 -34 -32 -14 -26 0 H26 C 32 -14 37 -34 40 -56Z" fill="url(#terracotta)"/>
      <rect x="-48" y="-72" width="96" height="19" rx="6" fill="#b06a41"/>
    </g>

    <rect x="330" y="560" width="544" height="22" rx="6" fill="url(#shelf)"/>
    <rect x="330" y="560" width="544" height="8" rx="4" fill="#d9c096" opacity="0.7"/>

    <!-- lower shelf items -->
    <g transform="translate(452 720)">
      <ellipse cx="0" cy="4" rx="72" ry="12" fill="#1d3a26" opacity="0.26" filter="url(#cast)"/>
      <g fill="url(#leafB)" stroke="#274a30" stroke-width="2.6" stroke-linejoin="round">
        <use href="#spray2" transform="translate(-18 -66) rotate(-18) scale(0.8)"/>
        <use href="#spray2" transform="translate(18 -68) rotate(16) scale(0.72)"/>
        <use href="#spray2" transform="translate(0 -70) scale(0.94)"/>
      </g>
      <path d="M-50 -68 C -47 -42 -40 -18 -32 0 H32 C 40 -18 47 -42 50 -68Z" fill="url(#terracotta)"/>
      <rect x="-58" y="-86" width="116" height="22" rx="6" fill="#b06a41"/>
    </g>

    <!-- watering can -->
    <g transform="translate(640 720)">
      <ellipse cx="4" cy="4" rx="92" ry="13" fill="#1d3a26" opacity="0.26" filter="url(#cast)"/>
      <path d="M-58 -96 H46 C 54 -60 54 -26 46 0 H-58 C -66 -30 -66 -66 -58 -96Z" fill="#8fa17c" stroke="#6c7c5c" stroke-width="3"/>
      <path d="M-58 -96 H-24 C -32 -62 -32 -28 -24 0 H-58 C -66 -30 -66 -66 -58 -96Z" fill="#ffffff" opacity="0.2"/>
      <path d="M-52 -96 C -46 -128 -8 -140 22 -126" fill="none" stroke="#6c7c5c" stroke-width="9" stroke-linecap="round"/>
      <path d="M46 -80 L104 -122 L118 -104 L58 -58Z" fill="#8fa17c" stroke="#6c7c5c" stroke-width="3"/>
      <ellipse cx="112" cy="-114" rx="16" ry="12" fill="#a2b28d" stroke="#6c7c5c" stroke-width="3" transform="rotate(-36 112 -114)"/>
      <rect x="-62" y="-104" width="112" height="14" rx="7" fill="#a2b28d"/>
    </g>

    <!-- stacked pots -->
    <g transform="translate(806 720)">
      <ellipse cx="0" cy="4" rx="60" ry="10" fill="#1d3a26" opacity="0.24" filter="url(#cast)"/>
      <path d="M-44 -54 C -41 -32 -35 -14 -29 0 H29 C 35 -14 41 -32 44 -54Z" fill="url(#terracotta)"/>
      <rect x="-52" y="-70" width="104" height="19" rx="6" fill="#b06a41"/>
      <path d="M-38 -104 C -35 -84 -30 -68 -25 -56 H25 C 30 -68 35 -84 38 -104Z" fill="#cd8a5c"/>
      <rect x="-46" y="-120" width="92" height="18" rx="6" fill="#bb7549"/>
    </g>

    <rect x="330" y="722" width="544" height="22" rx="6" fill="url(#shelf)"/>
    <rect x="330" y="722" width="544" height="8" rx="4" fill="#d9c096" opacity="0.7"/>
  </g>

  <!-- large floor planter -->
  <g transform="translate(1004 848)">
    <ellipse cx="0" cy="6" rx="124" ry="20" fill="#1d3a26" opacity="0.3" filter="url(#cast)"/>
    <g fill="none" stroke="#3d6b43" stroke-width="8" stroke-linecap="round">
      <path d="M-4 -132 C -28 -212 -44 -272 -54 -316"/>
      <path d="M-4 -132 C 22 -208 44 -262 62 -302"/>
      <path d="M-4 -132 C -8 -196 -8 -244 -2 -286"/>
    </g>
    <g fill="url(#leafA)" stroke="#2b5334" stroke-width="3" stroke-linejoin="round">
      <path d="M-54 -316 c -42 -18 -56 -62 -34 -98 c 42 20 58 62 34 98Z"/>
      <path d="M-54 -316 c 20 -40 68 -50 100 -24 c -26 36 -72 42 -100 24Z"/>
      <path d="M62 -302 c -28 -34 -22 -80 14 -104 c 28 34 22 78 -14 104Z"/>
      <path d="M-2 -286 c -34 -16 -44 -54 -24 -84 c 34 18 46 54 24 84Z"/>
      <path d="M-2 -286 c 18 -34 58 -42 84 -20 c -22 30 -60 36 -84 20Z"/>
    </g>
    <path d="M-88 -134 C -83 -86 -72 -38 -58 0 H58 C 72 -38 83 -86 88 -134Z" fill="url(#stone)"/>
    <path d="M-88 -134 C -83 -86 -72 -38 -58 0 H-22 C -34 -40 -44 -88 -48 -134Z" fill="#ffffff" opacity="0.42"/>
    <rect x="-100" y="-164" width="200" height="34" rx="9" fill="#efe9dc"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
