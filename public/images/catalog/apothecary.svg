<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Apothecary</title>
  <desc id="d">An amber dropper bottle, a corked stoneware jar and a salve tin beside a tied bundle of dried herbs.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#faf5e8"/>
      <stop offset="0.5" stop-color="#e7e2ce"/>
      <stop offset="1" stop-color="#adb693"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc7ab"/>
      <stop offset="1" stop-color="#948c70"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e0a94f"/>
      <stop offset="0.5" stop-color="#b9761f"/>
      <stop offset="1" stop-color="#7a4712"/>
    </linearGradient>
    <linearGradient id="clay" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#eee7d6"/>
      <stop offset="0.55" stop-color="#d8ccb2"/>
      <stop offset="1" stop-color="#a2947a"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#d3a771"/>
      <stop offset="1" stop-color="#a2764a"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#5c7b5f"/>
      <stop offset="0.55" stop-color="#3b5a41"/>
      <stop offset="1" stop-color="#24402b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <g id="herbSprig">
      <path d="M0 0 C -6 -54 -12 -104 -22 -148" fill="none" stroke="#6b8354" stroke-width="5" stroke-linecap="round"/>
      <g fill="#7d9660">
        <path d="M-4 -26 c -21 -7 -31 -25 -25 -45 c 21 9 31 26 25 45Z"/>
        <path d="M-2 -30 c 21 -9 37 -3 44 15 c -20 10 -38 4 -44 -15Z"/>
        <path d="M-10 -66 c -19 -7 -28 -23 -23 -41 c 19 8 28 23 23 41Z"/>
        <path d="M-9 -70 c 19 -9 34 -3 40 13 c -18 10 -34 4 -40 -13Z"/>
        <path d="M-17 -106 c -15 -7 -22 -20 -18 -35 c 15 7 23 20 18 35Z"/>
        <path d="M-16 -110 c 16 -8 28 -3 33 11 c -15 9 -28 4 -33 -11Z"/>
        <path d="M-22 -142 c -9 -12 -8 -26 3 -36 c 9 13 8 27 -3 36Z"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="630" y="-150" width="380" height="600" rx="190" fill="#ffffff" opacity="0.38" filter="url(#soft)"/>
  <circle cx="240" cy="750" r="230" fill="#6b5a3a" opacity="0.12" filter="url(#soft)"/>

  <g fill="#7f8d67" opacity="0.13">
    <path d="M258 590 C 216 518 230 428 288 376 C 334 446 324 536 258 590Z"/>
    <path d="M1000 586 C 956 516 968 424 1022 374 C 1068 444 1062 532 1000 586Z"/>
  </g>

  <rect x="0" y="690" width="1200" height="210" fill="url(#floor)"/>
  <rect x="0" y="686" width="1200" height="8" fill="#8a8266" opacity="0.5"/>

  <!-- dried herb bundle, left -->
  <g transform="translate(348 690)">
    <ellipse cx="0" cy="6" rx="118" ry="18" fill="#6b5a3a" opacity="0.28" filter="url(#cast)"/>
    <use href="#herbSprig" transform="translate(-24 -8) rotate(-14) scale(1.2)"/>
    <use href="#herbSprig" transform="translate(16 -6) rotate(9) scale(1.05) scale(-1 1)"/>
    <use href="#herbSprig" transform="translate(-2 -10) scale(1.34)"/>
    <g stroke="#a9855a" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M-38 -54 C -12 -64 16 -64 40 -54"/>
      <path d="M-36 -34 C -12 -44 16 -44 38 -34"/>
    </g>
    <path d="M40 -54 C 56 -46 62 -34 58 -20" fill="none" stroke="#a9855a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- corked stoneware jar, centre-left -->
  <g transform="translate(560 690)">
    <ellipse cx="4" cy="8" rx="128" ry="21" fill="#6b5a3a" opacity="0.3" filter="url(#cast)"/>
    <rect x="-98" y="-236" width="196" height="236" rx="30" fill="url(#clay)" stroke="#b3a68a" stroke-width="3.5"/>
    <path d="M-98 -206 C -98 -224 -84 -236 -68 -236 H-30 C -46 -170 -50 -80 -34 0 H-68 C -84 0 -98 -12 -98 -30Z" fill="#ffffff" opacity="0.45"/>
    <rect x="-72" y="-268" width="144" height="42" rx="12" fill="url(#cork)" stroke="#8d6540" stroke-width="3"/>
    <rect x="-58" y="-296" width="116" height="34" rx="10" fill="#c19565" stroke="#8d6540" stroke-width="3"/>
    <rect x="-70" y="-150" width="140" height="96" rx="10" fill="#f4efe1" stroke="#cdc2a8" stroke-width="3"/>
    <g fill="#3d6b43">
      <path d="M-18 -108 c -17 -8 -23 -27 -13 -42 c 17 9 24 27 13 42Z"/>
      <path d="M-16 -112 c 15 -13 34 -11 45 6 c -16 12 -35 10 -45 -6Z"/>
    </g>
    <g fill="#b9892e">
      <rect x="-46" y="-88" width="92" height="5" rx="2.5"/>
      <rect x="-32" y="-74" width="64" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- amber dropper bottle, centre-right -->
  <g transform="translate(760 690)">
    <ellipse cx="4" cy="8" rx="106" ry="18" fill="#6b5a3a" opacity="0.3" filter="url(#cast)"/>
    <rect x="-76" y="-198" width="152" height="198" rx="24" fill="url(#amber)" stroke="#8b5a19" stroke-width="3.5"/>
    <path d="M-76 -172 C -76 -186 -64 -198 -50 -198 H-22 C -40 -140 -44 -62 -30 0 H-50 C -64 0 -76 -12 -76 -26Z" fill="#f2c479" opacity="0.5"/>
    <rect x="-40" y="-232" width="80" height="40" rx="8" fill="#c88f37" stroke="#8b5a19" stroke-width="3"/>
    <rect x="-52" y="-266" width="104" height="38" rx="10" fill="#24402b"/>
    <rect x="-14" y="-306" width="28" height="46" rx="8" fill="#2f5236"/>
    <rect x="-56" y="-128" width="112" height="76" rx="8" fill="#f6f1e3" stroke="#d8ccb2" stroke-width="3"/>
    <g fill="#b9892e">
      <rect x="-38" y="-108" width="76" height="5" rx="2.5"/>
      <rect x="-26" y="-94" width="52" height="5" rx="2.5"/>
    </g>
    <path d="M-30 -80 c 14 -12 32 -10 42 6 c -15 11 -33 9 -42 -6Z" fill="#3d6b43"/>
  </g>

  <!-- salve tin, right -->
  <g transform="translate(916 690)">
    <ellipse cx="2" cy="6" rx="86" ry="15" fill="#6b5a3a" opacity="0.28" filter="url(#cast)"/>
    <rect x="-70" y="-78" width="140" height="78" rx="12" fill="url(#tin)" stroke="#1c3322" stroke-width="3"/>
    <ellipse cx="0" cy="-78" rx="70" ry="18" fill="#456b4b" stroke="#1c3322" stroke-width="3"/>
    <ellipse cx="0" cy="-80" rx="52" ry="12" fill="#37583d"/>
    <g fill="#c8a24a">
      <path d="M-16 -84 c 12 -11 28 -9 37 5 c -13 10 -29 8 -37 -5Z"/>
    </g>
    <rect x="-52" y="-46" width="104" height="5" rx="2.5" fill="#c8a24a" opacity="0.85"/>
    <rect x="-38" y="-30" width="76" height="5" rx="2.5" fill="#c8a24a" opacity="0.6"/>
  </g>

  <!-- scattered dried buds -->
  <g fill="#9a7c52" opacity="0.75">
    <ellipse cx="470" cy="742" rx="15" ry="7" transform="rotate(-16 470 742)"/>
    <ellipse cx="512" cy="762" rx="12" ry="6" transform="rotate(14 512 762)"/>
    <ellipse cx="1002" cy="748" rx="14" ry="7" transform="rotate(20 1002 748)"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
