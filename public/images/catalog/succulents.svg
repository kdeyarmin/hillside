<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Succulents</title>
  <desc id="d">Sculptural succulent rosettes planted in a shallow stone bowl with two small companion pots.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#faf6ea"/>
      <stop offset="0.5" stop-color="#e6e5d2"/>
      <stop offset="1" stop-color="#b6c0a2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3d2ba"/>
      <stop offset="1" stop-color="#9aa483"/>
    </linearGradient>
    <linearGradient id="bowlStone" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e6dcc6"/>
      <stop offset="0.55" stop-color="#cdc0a4"/>
      <stop offset="1" stop-color="#9c8f74"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#cb8256"/>
      <stop offset="1" stop-color="#8f4d2c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <g id="petalRingOuter" stroke="#37603c" stroke-width="2.6" stroke-linejoin="round">
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(40)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(80)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(120)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(160)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(200)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(240)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(280)"/>
      <path d="M0 0 C 20 -24 54 -26 72 -6 C 54 14 18 14 0 0Z" transform="rotate(320)"/>
    </g>
    <g id="petalRingMid" stroke="#37603c" stroke-width="2.4" stroke-linejoin="round">
      <path d="M0 0 C 14 -17 37 -18 50 -4 C 37 10 12 10 0 0Z" transform="rotate(20)"/>
      <path d="M0 0 C 14 -17 37 -18 50 -4 C 37 10 12 10 0 0Z" transform="rotate(80)"/>
      <path d="M0 0 C 14 -17 37 -18 50 -4 C 37 10 12 10 0 0Z" transform="rotate(140)"/>
      <path d="M0 0 C 14 -17 37 -18 50 -4 C 37 10 12 10 0 0Z" transform="rotate(200)"/>
      <path d="M0 0 C 14 -17 37 -18 50 -4 C 37 10 12 10 0 0Z" transform="rotate(260)"/>
      <path d="M0 0 C 14 -17 37 -18 50 -4 C 37 10 12 10 0 0Z" transform="rotate(320)"/>
    </g>
    <g id="petalRingCore" stroke="#37603c" stroke-width="2.2" stroke-linejoin="round">
      <path d="M0 0 C 9 -12 24 -13 32 -2 C 24 8 7 8 0 0Z" transform="rotate(45)"/>
      <path d="M0 0 C 9 -12 24 -13 32 -2 C 24 8 7 8 0 0Z" transform="rotate(135)"/>
      <path d="M0 0 C 9 -12 24 -13 32 -2 C 24 8 7 8 0 0Z" transform="rotate(225)"/>
      <path d="M0 0 C 9 -12 24 -13 32 -2 C 24 8 7 8 0 0Z" transform="rotate(315)"/>
    </g>

    <g id="rosetteSage">
      <use href="#petalRingOuter" fill="#84a06d"/>
      <use href="#petalRingMid" fill="#9db584"/>
      <use href="#petalRingCore" fill="#b6c79b"/>
    </g>
    <g id="rosetteDeep">
      <use href="#petalRingOuter" fill="#4f7a4b"/>
      <use href="#petalRingMid" fill="#659061"/>
      <use href="#petalRingCore" fill="#86a878"/>
    </g>
    <g id="rosetteBlush">
      <use href="#petalRingOuter" fill="#9aa07a"/>
      <use href="#petalRingMid" fill="#b3ac86"/>
      <use href="#petalRingCore" fill="#c9b98f"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="630" y="-140" width="380" height="600" rx="190" fill="#ffffff" opacity="0.34" filter="url(#soft)"/>
  <circle cx="240" cy="740" r="240" fill="#1d3a26" opacity="0.11" filter="url(#soft)"/>

  <g fill="#5d7a52" opacity="0.12">
    <path d="M268 604 C 224 528 240 432 302 376 C 352 452 342 546 268 604Z"/>
    <path d="M984 600 C 936 528 950 430 1010 372 C 1060 448 1054 542 984 600Z"/>
  </g>

  <rect x="0" y="690" width="1200" height="210" fill="url(#floor)"/>
  <rect x="0" y="686" width="1200" height="8" fill="#8c9673" opacity="0.45"/>

  <!-- small pot, left -->
  <g transform="translate(340 690)">
    <ellipse cx="4" cy="4" rx="96" ry="17" fill="#1d3a26" opacity="0.3" filter="url(#cast)"/>
    <use href="#rosetteDeep" transform="translate(0 -128) scale(0.82)"/>
    <path d="M-58 -100 C -55 -60 -48 -28 -40 0 H40 C 48 -28 55 -60 58 -100Z" fill="url(#terracotta)"/>
    <path d="M-58 -100 C -55 -60 -48 -28 -40 0 H-8 C -18 -34 -26 -66 -30 -100Z" fill="#ffffff" opacity="0.14"/>
    <rect x="-68" y="-122" width="136" height="26" rx="7" fill="#b06a41"/>
  </g>

  <!-- shallow stone bowl, centre -->
  <g transform="translate(614 690)">
    <ellipse cx="8" cy="8" rx="238" ry="27" fill="#1d3a26" opacity="0.32" filter="url(#cast)"/>
    <use href="#rosetteSage" transform="translate(-136 -150) scale(1.02)"/>
    <use href="#rosetteDeep" transform="translate(-16 -176) scale(1.34)"/>
    <use href="#rosetteBlush" transform="translate(116 -152) scale(1.06)"/>
    <use href="#rosetteSage" transform="translate(58 -124) scale(0.7)"/>
    <use href="#rosetteDeep" transform="translate(-78 -118) scale(0.62)"/>

    <!-- trailing string-of-pearls over the rim -->
    <g fill="none" stroke="#5f8a52" stroke-width="4" stroke-linecap="round">
      <path d="M-176 -108 C -204 -84 -218 -58 -224 -26"/>
      <path d="M182 -106 C 208 -82 220 -56 226 -26"/>
    </g>
    <g fill="#86a878" stroke="#4f7a4b" stroke-width="1.8">
      <circle cx="-186" cy="-98" r="9"/><circle cx="-200" cy="-78" r="9"/><circle cx="-211" cy="-56" r="9"/><circle cx="-219" cy="-32" r="8"/>
      <circle cx="192" cy="-96" r="9"/><circle cx="206" cy="-76" r="9"/><circle cx="217" cy="-54" r="9"/><circle cx="224" cy="-30" r="8"/>
    </g>

    <path d="M-206 -104 C -200 -68 -186 -34 -166 -8 C -100 6 100 6 166 -8 C 186 -34 200 -68 206 -104Z" fill="url(#bowlStone)"/>
    <path d="M-206 -104 C -200 -68 -186 -34 -166 -8 C -136 -1 -110 3 -84 5 C -114 -24 -136 -62 -146 -104Z" fill="#ffffff" opacity="0.42"/>
    <ellipse cx="0" cy="-106" rx="212" ry="26" fill="#dcd0b6"/>
    <ellipse cx="0" cy="-108" rx="192" ry="19" fill="#8e8266"/>
    <g fill="#b3a68a">
      <circle cx="-150" cy="-110" r="7"/><circle cx="-108" cy="-101" r="6"/><circle cx="-52" cy="-112" r="7"/>
      <circle cx="14" cy="-100" r="6"/><circle cx="76" cy="-111" r="7"/><circle cx="140" cy="-103" r="6"/>
      <circle cx="172" cy="-112" r="5"/><circle cx="-180" cy="-102" r="5"/>
    </g>
  </g>

  <!-- small pot, right -->
  <g transform="translate(884 690)">
    <ellipse cx="4" cy="4" rx="90" ry="16" fill="#1d3a26" opacity="0.28" filter="url(#cast)"/>
    <use href="#rosetteBlush" transform="translate(0 -118) scale(0.74)"/>
    <path d="M-52 -92 C -49 -56 -43 -26 -36 0 H36 C 43 -26 49 -56 52 -92Z" fill="#dad0b8"/>
    <path d="M-52 -92 C -49 -56 -43 -26 -36 0 H-8 C -16 -32 -23 -62 -26 -92Z" fill="#ffffff" opacity="0.45"/>
    <rect x="-61" y="-112" width="122" height="24" rx="6" fill="#e7dfcb"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
