  <circle cx="230" cy="740" r="240" fill="#16301f" opacity="0.13" filter="url(#soft)"/>

  <g fill="#2f5232" opacity="0.16">
    <path d="M268 622 C 214 528 240 418 314 358 C 372 448 356 556 268 622Z"/>
    <path d="M974 616 C 918 536 936 428 1002 366 C 1058 450 1052 552 974 616Z"/>
  </g>

  <rect x="0" y="690" width="1200" height="210" fill="url(#floor)"/>
  <rect x="0" y="686" width="1200" height="8" fill="#485a3f" opacity="0.55"/>

  <!-- venus flytraps, left -->
  <g transform="translate(392 692) scale(1.14)">
    <ellipse cx="4" cy="4" rx="126" ry="21" fill="#16301f" opacity="0.34" filter="url(#cast)"/>
    <g fill="none" stroke="#4a7541" stroke-width="8" stroke-linecap="round">
      <path d="M-6 -88 C -34 -122 -54 -146 -66 -166"/>
      <path d="M2 -90 C 20 -128 36 -158 48 -180"/>
      <path d="M0 -88 C -4 -124 -2 -152 4 -176"/>
    </g>
