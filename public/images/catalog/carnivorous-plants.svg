  <!-- hanging nepenthes, right -->
  <g transform="translate(858 692) scale(1.12)">
    <ellipse cx="4" cy="4" rx="116" ry="20" fill="#16301f" opacity="0.32" filter="url(#cast)"/>
    <g fill="none" stroke="#4a7541" stroke-width="8" stroke-linecap="round">
      <path d="M-4 -96 C -30 -150 -46 -206 -50 -258"/>
      <path d="M4 -96 C 30 -142 52 -180 74 -206"/>
    </g>
    <g fill="#4f7a44" stroke="#2f5c39" stroke-width="3">
      <path d="M-50 -258 c -34 -14 -48 -50 -32 -80 c 34 12 50 48 32 80Z"/>
      <path d="M74 -206 c 12 -34 50 -46 78 -26 c -16 32 -52 42 -78 26Z"/>
    </g>
    <use href="#jugPitcher" transform="translate(-48 -76) rotate(-8) scale(0.9)"/>
    <use href="#jugPitcher" transform="translate(64 -108) rotate(10) scale(0.74)"/>
    <path d="M-80 -100 C -76 -58 -66 -26 -55 0 H55 C 66 -26 76 -58 80 -100Z" fill="url(#crock)"/>
    <path d="M-80 -100 C -76 -58 -66 -26 -55 0 H-22 C -33 -32 -42 -66 -46 -100Z" fill="#ffffff" opacity="0.1"/>
    <rect x="-92" y="-124" width="184" height="30" rx="8" fill="#242e1c"/>
