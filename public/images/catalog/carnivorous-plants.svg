    <use href="#trap" transform="translate(48 -180) rotate(24) scale(0.86)"/>
    <use href="#trap" transform="translate(4 -176) rotate(-4)"/>
    <path d="M-74 -90 C -70 -52 -62 -24 -52 0 H52 C 62 -24 70 -52 74 -90Z" fill="url(#crock)"/>
    <path d="M-74 -90 C -70 -52 -62 -24 -52 0 H-20 C -30 -30 -38 -60 -42 -90Z" fill="#ffffff" opacity="0.1"/>
    <rect x="-86" y="-112" width="172" height="28" rx="7" fill="#242e1c"/>
    <path d="M-70 -90 C -40 -100 -14 -98 8 -92 C 34 -100 58 -98 70 -90Z" fill="#4a6c39"/>
  </g>

  <!-- sarracenia trumpets, centre -->
  <g transform="translate(614 694) scale(1.16)">
    <ellipse cx="6" cy="6" rx="150" ry="23" fill="#16301f" opacity="0.36" filter="url(#cast)"/>
    <use href="#sarracenia" transform="translate(-58 -128) rotate(-11) scale(1.16)"/>
    <use href="#sarracenia" transform="translate(56 -130) rotate(12) scale(1.04)"/>
    <use href="#sarracenia" transform="translate(-4 -134) scale(1.34)"/>
    <path d="M-92 -132 C -88 -76 -78 -32 -66 0 H66 C 78 -32 88 -76 92 -132Z" fill="url(#crock)"/>
    <path d="M-92 -132 C -88 -76 -78 -32 -66 0 H-26 C -38 -38 -48 -84 -52 -132Z" fill="#ffffff" opacity="0.1"/>
    <rect x="-106" y="-160" width="212" height="34" rx="8" fill="#242e1c"/>
    <path d="M-88 -132 C -50 -144 -18 -142 10 -134 C 44 -144 74 -140 88 -132Z" fill="#4a6c39"/>
    <g fill="#7d9b5c" opacity="0.85">
