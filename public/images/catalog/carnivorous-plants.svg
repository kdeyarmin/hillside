<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Carnivorous plants</title>
  <desc id="d">Venus flytraps, pitcher plants and sarracenia trumpets growing in a mossy bog planter.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f4f5e8"/>
      <stop offset="0.5" stop-color="#d5dcc0"/>
      <stop offset="1" stop-color="#9aab86"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9d78"/>
      <stop offset="1" stop-color="#56684c"/>
    </linearGradient>
    <linearGradient id="trumpet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#255232"/>
      <stop offset="0.6" stop-color="#5b8c45"/>
      <stop offset="1" stop-color="#9c4732"/>
    </linearGradient>
    <linearGradient id="jug" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#74994e"/>
      <stop offset="0.55" stop-color="#3f6b39"/>
      <stop offset="1" stop-color="#7e3626"/>
    </linearGradient>
    <linearGradient id="crock" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#4f5b46"/>
      <stop offset="1" stop-color="#28331f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <g id="trap">
      <path d="M-4 0 C -30 -8 -46 -30 -44 -54 C -42 -70 -24 -77 -10 -66 C -4 -60 -2 -28 -4 0Z" fill="#3f7040" stroke="#27502f" stroke-width="3"/>
      <path d="M4 0 C 30 -8 46 -30 44 -54 C 42 -70 24 -77 10 -66 C 4 -60 2 -28 4 0Z" fill="#4d8449" stroke="#27502f" stroke-width="3"/>
      <path d="M-9 -14 C -26 -22 -35 -37 -33 -52 C -22 -58 -13 -46 -9 -27Z" fill="#95372a"/>
      <path d="M9 -14 C 26 -22 35 -37 33 -52 C 22 -58 13 -46 9 -27Z" fill="#a8432f"/>
      <g stroke="#2b5533" stroke-width="3.4" stroke-linecap="round">
        <path d="M-43 -58 l -13 -13"/><path d="M-40 -40 l -16 -9"/><path d="M-32 -22 l -16 -4"/>
        <path d="M43 -58 l 13 -13"/><path d="M40 -40 l 16 -9"/><path d="M32 -22 l 16 -4"/>
      </g>
    </g>

    <g id="jugPitcher">
      <path d="M0 -196 C -12 -180 -26 -166 -34 -150" fill="none" stroke="#4a7541" stroke-width="7" stroke-linecap="round"/>
      <path d="M-38 -142 C -54 -100 -50 -44 -28 -14 C -10 8 14 8 30 -14 C 52 -44 54 -100 38 -142Z" fill="url(#jug)" stroke="#2f5c39" stroke-width="3.5"/>
      <path d="M-30 -128 C -40 -92 -38 -50 -22 -24" fill="none" stroke="#c9d6b0" stroke-width="5" stroke-opacity="0.45" stroke-linecap="round"/>
      <ellipse cx="0" cy="-142" rx="39" ry="11" fill="#a8432f" stroke="#7e3122" stroke-width="3"/>
      <ellipse cx="0" cy="-144" rx="27" ry="6" fill="#3d2b22"/>
      <path d="M-30 -152 C -18 -188 20 -194 42 -172 C 22 -158 -4 -150 -30 -152Z" fill="#5f8b47" stroke="#2f5c39" stroke-width="3.5"/>
      <g stroke="#8d4030" stroke-width="2.6" stroke-opacity="0.6">
        <path d="M-22 -156 C -6 -172 12 -178 32 -173"/>
        <path d="M-16 -150 C 0 -164 16 -170 36 -168"/>
      </g>
    </g>

    <g id="sarracenia">
      <path d="M-15 0 C -22 -80 -26 -152 -19 -198 C -7 -209 13 -209 23 -198 C 28 -152 21 -80 15 0Z" fill="url(#trumpet)" stroke="#2f5c39" stroke-width="3.5"/>
      <path d="M-19 -198 C -11 -230 27 -236 38 -208 C 25 -197 0 -193 -19 -198Z" fill="#6f9556" stroke="#2f5c39" stroke-width="3.5"/>
