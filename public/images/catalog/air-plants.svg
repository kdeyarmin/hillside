<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Air plants</title>
  <desc id="d">Tillandsia air plants suspended in hanging glass globes with two more resting on a driftwood branch.</desc>
  <defs>
    <linearGradient id="wall" x1="0.25" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fbf8ee"/>
      <stop offset="0.5" stop-color="#e0e6d3"/>
      <stop offset="1" stop-color="#a1b298"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3caaf"/>
      <stop offset="1" stop-color="#889574"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#eaf0e5" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#93a88f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d7c6a8"/>
      <stop offset="0.6" stop-color="#ab9576"/>
      <stop offset="1" stop-color="#75634b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- one arching blade, tip up -->
    <path id="blade" d="M0 8 C -11 -22 -13 -54 -3 -86 C 11 -54 9 -22 0 8Z"/>

    <g id="tillandsia" stroke="#38623f" stroke-width="2.2" stroke-linejoin="round">
      <g fill="#5c8a55">
        <use href="#blade" transform="rotate(-74) scale(0.94)"/>
        <use href="#blade" transform="rotate(74) scale(0.94)"/>
        <use href="#blade" transform="rotate(-54) scale(1.08)"/>
        <use href="#blade" transform="rotate(54) scale(1.08)"/>
      </g>
      <g fill="#6d9b62">
        <use href="#blade" transform="rotate(-34) scale(1.2)"/>
        <use href="#blade" transform="rotate(34) scale(1.2)"/>
        <use href="#blade" transform="rotate(-15) scale(1.3)"/>
        <use href="#blade" transform="rotate(15) scale(1.3)"/>
      </g>
      <g fill="#8db479">
        <use href="#blade" transform="rotate(-44) scale(0.7)"/>
        <use href="#blade" transform="rotate(44) scale(0.7)"/>
        <use href="#blade" transform="rotate(-6) scale(0.86)"/>
        <use href="#blade" transform="rotate(6) scale(0.86)"/>
      </g>
    </g>

    <g id="globe">
      <circle cx="0" cy="0" r="104" fill="url(#glass)" stroke="#f6f8f2" stroke-width="5" stroke-opacity="0.9"/>
      <path d="M-44 -94 A 104 104 0 0 1 44 -94 L 33 -70 A 78 78 0 0 0 -33 -70Z" fill="#f1f5eb" opacity="0.6"/>
      <path d="M-64 -58 C -86 -34 -88 6 -70 36" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.6" stroke-linecap="round"/>
      <path d="M-38 -76 C -56 -62 -64 -44 -66 -26" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.45" stroke-linecap="round"/>
      <ellipse cx="0" cy="70" rx="58" ry="18" fill="#bcc7ac"/>
      <g fill="#8b9878">
        <circle cx="-30" cy="66" r="8"/><circle cx="-6" cy="74" r="9"/><circle cx="20" cy="66" r="8"/><circle cx="42" cy="71" r="6"/>
      </g>
      <circle cx="0" cy="0" r="104" fill="none" stroke="#75866c" stroke-width="3" stroke-opacity="0.45"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="620" y="-160" width="400" height="620" rx="200" fill="#ffffff" opacity="0.36" filter="url(#soft)"/>
  <circle cx="250" cy="750" r="230" fill="#1d3a26" opacity="0.11" filter="url(#soft)"/>

  <g fill="#5d7a52" opacity="0.12">
    <path d="M262 590 C 220 518 234 428 292 374 C 338 446 328 536 262 590Z"/>
    <path d="M992 586 C 948 516 960 424 1016 372 C 1064 444 1058 532 992 586Z"/>
  </g>

  <rect x="0" y="690" width="1200" height="210" fill="url(#floor)"/>
  <rect x="0" y="686" width="1200" height="8" fill="#7c8968" opacity="0.5"/>

  <!-- hanging cords -->
  <g stroke="#8b7f66" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M392 0 L392 130"/>
    <path d="M812 0 L812 214"/>
  </g>
  <g fill="#b9892e">
    <circle cx="392" cy="132" r="9"/>
    <circle cx="812" cy="216" r="9"/>
  </g>

  <!-- hanging globes -->
  <g transform="translate(392 348)">
    <use href="#globe" transform="scale(1.2)"/>
    <use href="#tillandsia" transform="translate(0 46) scale(1.16)"/>
  </g>
  <g transform="translate(812 412)">
    <use href="#globe" transform="scale(0.94)"/>
    <use href="#tillandsia" transform="translate(0 36) scale(0.94)"/>
  </g>

  <!-- driftwood perch -->
  <g transform="translate(606 686)">
    <ellipse cx="10" cy="10" rx="212" ry="24" fill="#1d3a26" opacity="0.3" filter="url(#cast)"/>
    <path d="M-200 -26 C -140 -64 -58 -74 12 -62 C 84 -50 148 -60 198 -32 C 168 8 100 18 18 12 C -64 6 -144 12 -200 -26Z" fill="url(#wood)" stroke="#6f5f49" stroke-width="3.5"/>
    <g stroke="#8d7a5e" stroke-width="3.4" stroke-opacity="0.8" fill="none">
      <path d="M-172 -30 C -108 -52 -26 -56 48 -46 C 112 -38 152 -42 180 -30"/>
      <path d="M-160 -10 C -96 -26 -18 -30 52 -22 C 114 -16 148 -18 172 -10"/>
    </g>
    <use href="#tillandsia" transform="translate(-88 -58) scale(0.96) rotate(-8)"/>
    <use href="#tillandsia" transform="translate(96 -50) scale(0.8) rotate(9)"/>
    <g fill="#a3ab8c">
      <ellipse cx="-238" cy="14" rx="28" ry="12"/>
      <ellipse cx="244" cy="10" rx="24" ry="11"/>
    </g>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
