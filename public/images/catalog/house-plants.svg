      <path d="M-78 -66 c -26 -5 -39 -27 -31 -49 c 24 -2 45 15 45 38 c 0 8 -6 13 -14 11Z"/>
      <path d="M-110 -32 c -26 0 -43 -20 -38 -43 c 25 -6 46 9 50 32 c 1 8 -5 12 -12 11Z"/>
      <path d="M44 -78 c 24 -13 48 -3 57 19 c -20 15 -46 9 -57 -7 c -4 -6 -4 -10 0 -12Z"/>
      <path d="M88 -50 c 26 -9 48 4 53 26 c -22 12 -47 3 -56 -14 c -3 -6 -1 -11 3 -12Z"/>
      <path d="M14 -164 c 22 -16 47 -10 59 10 c -17 18 -44 17 -57 3 c -5 -5 -6 -10 -2 -13Z"/>
      <path d="M-6 -132 c -25 -10 -33 -34 -20 -55 c 23 3 39 24 34 46 c -2 8 -7 12 -14 9Z"/>
    </g>
    <path d="M-58 -94 C -54 -58 -48 -28 -40 0 H40 C 48 -28 54 -58 58 -94Z" fill="url(#terracotta)"/>
    <path d="M-58 -94 C -54 -58 -48 -28 -40 0 H-6 C -16 -32 -24 -62 -28 -94Z" fill="#ffffff" opacity="0.13"/>
    <rect x="-68" y="-116" width="136" height="28" rx="7" fill="#b06a41"/>
  </g>

  <!-- monstera -->
  <g transform="translate(608 690)">
    <ellipse cx="8" cy="6" rx="160" ry="24" fill="#1d3a26" opacity="0.34" filter="url(#cast)"/>
    <g fill="none" stroke="#3d6b43" stroke-width="9" stroke-linecap="round">
      <path d="M-4 -150 C -58 -198 -92 -226 -116 -244"/>
      <path d="M-4 -150 C 46 -196 82 -224 108 -246"/>
      <path d="M-4 -150 C -26 -262 -40 -336 -50 -388"/>
      <path d="M-4 -150 C 20 -258 44 -330 66 -378"/>
      <path d="M-4 -150 C -10 -218 -12 -262 -8 -300"/>
