  <rect x="0" y="686" width="1200" height="8" fill="#7d8a6f" opacity="0.45"/>

  <!-- trailing pothos -->
  <g transform="translate(372 690)">
    <ellipse cx="4" cy="4" rx="118" ry="20" fill="#1d3a26" opacity="0.32" filter="url(#cast)"/>
    <g fill="none" stroke="#406d42" stroke-width="6" stroke-linecap="round">
