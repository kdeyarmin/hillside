    <path d="M-80 -124 C -76 -72 -66 -30 -55 0 H55 C 66 -30 76 -72 80 -124Z" fill="#2c4a33"/>
    <path d="M-80 -124 C -76 -72 -66 -30 -55 0 H-24 C -35 -37 -42 -80 -46 -124Z" fill="#ffffff" opacity="0.09"/>
    <rect x="-92" y="-150" width="184" height="32" rx="8" fill="#234029"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
