    <rect x="-114" y="-180" width="228" height="38" rx="9" fill="#efe9dc"/>
    <path d="M-114 -158 H114" stroke="#cac1ab" stroke-width="3"/>
  </g>

  <!-- snake plant -->
  <g transform="translate(858 690)">
    <ellipse cx="4" cy="4" rx="110" ry="19" fill="#1d3a26" opacity="0.3" filter="url(#cast)"/>
    <g stroke="#1e3d29" stroke-width="3">
      <path d="M0 -118 c -24 -92 -20 -212 4 -302 c 22 92 22 210 6 302Z" fill="#2f5c3a" transform="rotate(-18)"/>
      <path d="M0 -118 c -22 -100 -16 -224 6 -328 c 24 104 22 228 4 328Z" fill="#3d7146" transform="rotate(-6)"/>
      <path d="M0 -118 c -22 -94 -16 -210 6 -306 c 24 96 22 214 4 306Z" fill="#2f5c3a" transform="rotate(7)"/>
      <path d="M0 -118 c -18 -76 -12 -170 8 -240 c 20 76 16 168 2 240Z" fill="#457c4c" transform="rotate(20)"/>
    </g>
    <g fill="#b9892e" opacity="0.45">
