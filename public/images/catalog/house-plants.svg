<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">House plants</title>
  <desc id="d">A split-leaf monstera, a trailing pothos and a snake plant potted together against a soft sage wall.</desc>
  <defs>
    <linearGradient id="wall" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f5f2e7"/>
      <stop offset="0.52" stop-color="#dde4d1"/>
      <stop offset="1" stop-color="#aebb9f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6cdb5"/>
      <stop offset="1" stop-color="#8b9779"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0.75" y2="0">
      <stop offset="0" stop-color="#2b5335"/>
      <stop offset="1" stop-color="#5d8c56"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="0.75" y2="0">
      <stop offset="0" stop-color="#23452c"/>
      <stop offset="1" stop-color="#4a7548"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#c67c50"/>
      <stop offset="1" stop-color="#8d4b2b"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#f8f4ea"/>
      <stop offset="1" stop-color="#d4cdba"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <g id="monstera">
      <path d="M0 6 L0 -198" fill="none" stroke="#1f3f2a" stroke-width="7" stroke-linecap="round"/>
      <path d="M2 -14 C 46 -22 86 -46 104 -84 C 60 -96 22 -70 2 -40Z"/>
      <path d="M2 -62 C 46 -70 82 -96 96 -132 C 54 -142 20 -116 2 -88Z"/>
      <path d="M2 -110 C 42 -118 72 -142 84 -174 C 46 -182 18 -158 2 -134Z"/>
      <path d="M2 -156 C 34 -166 58 -186 66 -212 C 34 -216 12 -196 2 -178Z"/>
      <path d="M-2 -14 C -46 -22 -86 -46 -104 -84 C -60 -96 -22 -70 -2 -40Z"/>
      <path d="M-2 -62 C -46 -70 -82 -96 -96 -132 C -54 -142 -20 -116 -2 -88Z"/>
      <path d="M-2 -110 C -42 -118 -72 -142 -84 -174 C -46 -182 -18 -158 -2 -134Z"/>
      <path d="M-2 -156 C -34 -166 -58 -186 -66 -212 C -34 -216 -12 -196 -2 -178Z"/>
      <path d="M0 -186 C 14 -198 26 -208 30 -224 C 12 -226 2 -212 0 -200Z"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="640" y="-140" width="380" height="620" rx="190" fill="#ffffff" opacity="0.36" filter="url(#soft)"/>
  <circle cx="230" cy="740" r="240" fill="#1d3a26" opacity="0.12" filter="url(#soft)"/>

  <g fill="#3d6142" opacity="0.13">
