<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5d5af" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a6741" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)" stop-opacity="0"/>
      <stop offset="60%" stop-color="rgba(0,0,0,0.1)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.45)" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Botanical leaf pattern -->
  <g opacity="0.12" fill="#4a6741">
    <ellipse cx="400" cy="250" rx="180" ry="60" transform="rotate(-30 400 250)"/>
    <ellipse cx="350" cy="200" rx="140" ry="45" transform="rotate(15 350 200)"/>
    <ellipse cx="450" cy="300" rx="160" ry="50" transform="rotate(-50 450 300)"/>
    <ellipse cx="300" cy="320" rx="120" ry="40" transform="rotate(20 300 320)"/>
  </g>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <!-- Category label at bottom -->
  <text x="40" y="540" font-family="Georgia, serif" font-size="42" fill="white" opacity="0.9">Live Plant Planters</text>
  <text x="40" y="568" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.7" letter-spacing="2">THE HILLSIDE GARDENS</text>
</svg>