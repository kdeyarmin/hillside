<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">Live plant planters</title>
  <desc id="d">A long stoneware trough planted with mixed greenery, blooms and trailing ivy beside a smaller potted arrangement.</desc>
  <defs>
    <linearGradient id="wall" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#f7f3e8"/>
      <stop offset="0.52" stop-color="#e2e3d1"/>
      <stop offset="1" stop-color="#b2bda1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd0ba"/>
      <stop offset="1" stop-color="#94a081"/>
    </linearGradient>
    <linearGradient id="trough" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f4efe2"/>
      <stop offset="0.6" stop-color="#e0d8c5"/>
      <stop offset="1" stop-color="#bdb39c"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#cf9564"/>
      <stop offset="1" stop-color="#94512f"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#2f5a39"/>
      <stop offset="1" stop-color="#6b9a5d"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#27492f"/>
      <stop offset="1" stop-color="#54804d"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#14291c" stop-opacity="0"/>
      <stop offset="1" stop-color="#14291c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="cast" x="-50%" y="-90%" width="200%" height="280%"><feGaussianBlur stdDeviation="14"/></filter>

    <g id="spray">
      <path d="M0 0 C -6 -50 -6 -96 0 -138" fill="none" stroke="#3f6b43" stroke-width="6" stroke-linecap="round"/>
      <path d="M-2 -26 c -26 -6 -42 -26 -40 -50 c 26 4 42 24 40 50Z"/>
      <path d="M2 -26 c 26 -6 42 -26 40 -50 c -26 4 -42 24 -40 50Z"/>
      <path d="M-2 -66 c -24 -6 -38 -26 -35 -48 c 24 5 38 25 35 48Z"/>
      <path d="M2 -66 c 24 -6 38 -26 35 -48 c -24 5 -38 25 -35 48Z"/>
      <path d="M-1 -104 c -19 -6 -30 -24 -27 -43 c 20 6 31 24 27 43Z"/>
      <path d="M1 -104 c 19 -6 30 -24 27 -43 c -20 6 -31 24 -27 43Z"/>
      <path d="M0 -128 c -12 -10 -14 -28 -6 -42 c 13 10 17 28 6 42Z"/>
    </g>

    <g id="bloom">
      <g fill="#f6f1e2" stroke="#d9d1bb" stroke-width="2">
        <ellipse cx="0" cy="-13" rx="8" ry="13"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(144)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(216)"/>
        <ellipse cx="0" cy="-13" rx="8" ry="13" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#c8992f"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>
  <rect x="620" y="-140" width="400" height="620" rx="200" fill="#ffffff" opacity="0.34" filter="url(#soft)"/>
  <circle cx="230" cy="740" r="240" fill="#1d3a26" opacity="0.12" filter="url(#soft)"/>

  <g fill="#3d6142" opacity="0.12">
    <path d="M252 610 C 204 528 224 424 292 364 C 348 446 336 546 252 610Z"/>
    <path d="M1000 606 C 946 528 962 424 1026 364 C 1082 446 1076 544 1000 606Z"/>
  </g>

  <rect x="0" y="690" width="1200" height="210" fill="url(#floor)"/>
  <rect x="0" y="686" width="1200" height="8" fill="#84906e" opacity="0.45"/>

  <!-- small companion pot, right -->
  <g transform="translate(886 690)">
    <ellipse cx="4" cy="4" rx="104" ry="18" fill="#1d3a26" opacity="0.3" filter="url(#cast)"/>
    <g fill="url(#leafB)" stroke="#274a30" stroke-width="3" stroke-linejoin="round">
      <use href="#spray" transform="translate(-24 -94) rotate(-14) scale(0.86)"/>
      <use href="#spray" transform="translate(26 -96) rotate(15) scale(0.78)"/>
      <use href="#spray" transform="translate(0 -100) scale(1)"/>
    </g>
    <use href="#bloom" transform="translate(-44 -168) scale(0.9)"/>
    <use href="#bloom" transform="translate(38 -186) scale(0.78)"/>
    <path d="M-68 -96 C -64 -56 -56 -26 -46 0 H46 C 56 -26 64 -56 68 -96Z" fill="url(#bowl)"/>
    <path d="M-68 -96 C -64 -56 -56 -26 -46 0 H-14 C -24 -32 -32 -64 -36 -96Z" fill="#ffffff" opacity="0.14"/>
    <rect x="-78" y="-118" width="156" height="28" rx="7" fill="#b06f43"/>
  </g>

  <!-- long trough planter, centre -->
  <g transform="translate(556 690)">
    <ellipse cx="8" cy="8" rx="270" ry="30" fill="#1d3a26" opacity="0.32" filter="url(#cast)"/>

    <!-- back greenery -->
    <g fill="url(#leafB)" stroke="#274a30" stroke-width="3" stroke-linejoin="round">
      <use href="#spray" transform="translate(-146 -120) rotate(-20) scale(1.02)"/>
      <use href="#spray" transform="translate(-72 -128) rotate(-8) scale(1.26)"/>
      <use href="#spray" transform="translate(16 -130) rotate(6) scale(1.34)"/>
      <use href="#spray" transform="translate(104 -124) rotate(18) scale(1.08)"/>
      <use href="#spray" transform="translate(170 -116) rotate(30) scale(0.86)"/>
    </g>

    <!-- front mounding foliage -->
    <g fill="url(#leafA)" stroke="#2b5334" stroke-width="3" stroke-linejoin="round">
      <path d="M-190 -112 c -34 -14 -46 -50 -28 -80 c 34 16 46 50 28 80Z"/>
      <path d="M-140 -108 c 20 -32 58 -38 84 -14 c -22 30 -60 34 -84 14Z"/>
      <path d="M-40 -114 c -32 -18 -40 -54 -20 -82 c 32 20 40 54 20 82Z"/>
      <path d="M56 -112 c 22 -30 60 -34 84 -10 c -24 28 -62 30 -84 10Z"/>
      <path d="M150 -108 c -30 -20 -34 -56 -12 -82 c 30 22 34 56 12 82Z"/>
    </g>

    <!-- blooms -->
    <use href="#bloom" transform="translate(-118 -206) scale(1.02)"/>
    <use href="#bloom" transform="translate(-14 -240) scale(1.16)"/>
    <use href="#bloom" transform="translate(96 -214) scale(0.94)"/>
    <use href="#bloom" transform="translate(48 -172) scale(0.72)"/>
    <use href="#bloom" transform="translate(-74 -160) scale(0.68)"/>

    <!-- trailing ivy -->
    <g fill="none" stroke="#3f6b43" stroke-width="6" stroke-linecap="round">
      <path d="M-196 -96 C -232 -66 -258 -34 -276 4"/>
      <path d="M196 -96 C 232 -68 258 -36 274 2"/>
    </g>
    <g fill="url(#leafA)" stroke="#2b5334" stroke-width="2.6">
      <path d="M-222 -78 c -24 -10 -31 -33 -18 -52 c 22 5 35 26 28 46 c -2 6 -6 8 -10 6Z"/>
      <path d="M-248 -50 c -25 -6 -35 -28 -24 -48 c 23 3 37 23 32 43 c -1 6 -4 7 -8 5Z"/>
      <path d="M-268 -18 c -24 2 -38 -18 -30 -38 c 22 -3 38 14 38 32 c 0 5 -4 7 -8 6Z"/>
      <path d="M222 -78 c 24 -10 31 -33 18 -52 c -22 5 -35 26 -28 46 c 2 6 6 8 10 6Z"/>
      <path d="M248 -50 c 25 -6 35 -28 24 -48 c -23 3 -37 23 -32 43 c 1 6 4 7 8 5Z"/>
      <path d="M266 -18 c 24 2 38 -18 30 -38 c -22 -3 -38 14 -38 32 c 0 5 4 7 8 6Z"/>
    </g>

    <!-- the trough -->
    <path d="M-232 -104 C -226 -58 -214 -22 -200 0 H200 C 214 -22 226 -58 232 -104Z" fill="url(#trough)"/>
    <path d="M-232 -104 C -226 -58 -214 -22 -200 0 H-136 C -152 -30 -166 -66 -172 -104Z" fill="#ffffff" opacity="0.46"/>
    <rect x="-250" y="-136" width="500" height="40" rx="10" fill="#f2ece0"/>
    <path d="M-250 -110 H250" stroke="#cdc4ae" stroke-width="3"/>
    <g stroke="#c3b9a1" stroke-width="3" opacity="0.7">
      <path d="M-196 -78 H196"/>
      <path d="M-186 -50 H186"/>
    </g>
    <path d="M-236 -122 C -180 -132 -100 -136 -8 -136 C 92 -136 176 -131 236 -122" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="5"/>
  </g>

  <rect width="1200" height="900" fill="url(#fade)"/>
</svg>
