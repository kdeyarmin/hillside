<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Botanical still life</title>
  <desc id="desc">A refined illustration of leafy stems, a soap bar and botanical bottles in sage, cream and gold.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9dc"/>
      <stop offset="0.55" stop-color="#cdd4c3"/>
      <stop offset="1" stop-color="#728269"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d8d3c5" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a54c"/>
      <stop offset="1" stop-color="#8c5f1b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa17c"/>
      <stop offset="1" stop-color="#294f35"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#17351f" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="1010" cy="135" r="250" fill="#ffffff" opacity="0.22" filter="url(#soft)"/>
  <circle cx="175" cy="745" r="280" fill="#17351f" opacity="0.12" filter="url(#soft)"/>
  <path d="M0 724 C210 655 393 685 584 746 C807 817 1009 813 1200 711 V900 H0Z" fill="#203f2b" opacity="0.28"/>

  <g fill="none" stroke="#25462c" stroke-width="13" stroke-linecap="round">
    <path d="M170 625 C251 500 329 359 522 179"/>
    <path d="M786 612 C842 474 913 354 1061 228"/>
  </g>

  <g fill="url(#leaf)" stroke="#294f35" stroke-width="3">
    <path d="M237 536 C145 503 127 418 159 349 C236 392 276 460 237 536Z"/>
    <path d="M323 430 C240 371 252 284 302 230 C369 299 379 377 323 430Z"/>
    <path d="M410 326 C349 249 383 171 449 130 C492 218 476 286 410 326Z"/>
    <path d="M326 485 C415 427 499 454 550 514 C459 551 380 544 326 485Z"/>
    <path d="M429 361 C518 316 597 349 639 414 C547 438 476 422 429 361Z"/>
    <path d="M836 501 C765 437 786 355 844 307 C903 375 904 451 836 501Z"/>
    <path d="M913 392 C865 309 909 235 981 207 C1014 300 987 365 913 392Z"/>
    <path d="M878 459 C966 411 1047 440 1092 503 C1000 531 925 517 878 459Z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="374" y="545" width="214" height="220" rx="26" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
    <rect x="407" y="497" width="148" height="66" rx="15" fill="#203f2b"/>
    <rect x="425" y="610" width="112" height="74" rx="10" fill="#f8f5ed" opacity="0.9"/>
    <path d="M456 654 C477 624 509 624 528 654 C505 669 478 670 456 654Z" fill="#8a956f"/>

    <rect x="624" y="471" width="164" height="294" rx="29" fill="url(#amber)" stroke="#e5c36f" stroke-width="4"/>
    <rect x="650" y="413" width="112" height="76" rx="14" fill="#efe9dc"/>
    <rect x="678" y="375" width="56" height="52" rx="10" fill="#203f2b"/>
    <rect x="649" y="570" width="114" height="96" rx="12" fill="#f6f0e3" opacity="0.9"/>
    <path d="M678 624 C697 594 725 594 744 624 C724 640 698 640 678 624Z" fill="#69795b"/>

    <rect x="805" y="612" width="206" height="130" rx="28" fill="#efe3c9" stroke="#ffffff" stroke-opacity="0.65" stroke-width="4"/>
    <path d="M838 677 C874 630 922 630 962 677 C922 705 877 704 838 677Z" fill="#b9892e" opacity="0.72"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="5">
    <path d="M397 584 C433 555 519 554 562 584"/>
    <path d="M648 517 C678 491 735 492 764 517"/>
