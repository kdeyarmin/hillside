<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 40 520 480" role="img" aria-labelledby="title">
  <title id="title">The Hillside Gardens</title>
  <!-- Compact lockup for small overlays: arch, leaves and wordmark only. The
       "PLANTS • TEAS • BOTANICALS" tagline is dropped because it is illegible
       below about 200px wide. -->
  <defs>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7ad8f"/>
      <stop offset="0.52" stop-color="#7f8d67"/>
      <stop offset="1" stop-color="#667555"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#71805f"/>
      <stop offset="0.55" stop-color="#99a184"/>
      <stop offset="1" stop-color="#7c8967"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c99a3b"/>
      <stop offset="1" stop-color="#a9771d"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#18371f" stroke-linecap="round">
    <path d="M151 283 C119 92 594 -4 568 283" stroke-width="3.4"/>
    <path d="M214 304 C255 232 308 174 425 87" stroke-width="4"/>
  </g>

  <g stroke="#25462c" stroke-width="1.05" stroke-linejoin="round">
    <path d="M235 257 C209 238 201 206 211 173 C237 190 249 222 235 257Z" fill="url(#leafA)"/>
    <path d="M274 217 C251 191 250 158 264 128 C288 151 293 187 274 217Z" fill="url(#leafB)"/>
    <path d="M322 170 C304 137 311 103 328 80 C345 109 343 144 322 170Z" fill="url(#leafA)"/>
    <path d="M370 135 C372 100 393 72 420 59 C415 91 396 121 370 135Z" fill="url(#leafB)"/>
    <path d="M397 156 C428 139 458 141 484 154 C459 172 426 174 397 156Z" fill="url(#leafA)"/>
    <path d="M337 199 C368 186 402 195 427 216 C394 224 361 216 337 199Z" fill="url(#leafB)"/>
    <path d="M273 248 C305 237 337 244 359 261 C328 272 295 266 273 248Z" fill="url(#leafA)"/>
  </g>

  <g fill="none" stroke="#18371f" stroke-width="1.6" stroke-linecap="round">
    <path d="M234 253 L214 181"/>
    <path d="M273 212 L264 136"/>
    <path d="M322 165 L328 88"/>
    <path d="M374 131 L415 66"/>
    <path d="M402 155 L475 154"/>
    <path d="M341 199 L420 214"/>
    <path d="M278 248 L352 260"/>
  </g>

  <g fill="#17351d" text-anchor="middle">
    <text x="360" y="326" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="500" letter-spacing="13">THE</text>
    <text x="360" y="437" font-family="Georgia, 'Times New Roman', serif" font-size="91" font-weight="400" letter-spacing="6">HILLSIDE</text>
    <text x="360" y="501" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="500" letter-spacing="18">GARDENS</text>
  </g>

  <g fill="none" stroke="url(#gold)" stroke-width="2.5">
    <path d="M238 310 H289"/>
    <path d="M431 310 H482"/>
  </g>
</svg>
